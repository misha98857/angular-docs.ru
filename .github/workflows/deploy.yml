# Builds adev (Russian docs) and uploads it to the hub server, which serves https://angular-docs.ru/.
#
# Upstream builds adev on large runners with Angular's remote build cache; this fork
# builds on a regular runner and keeps a Bazel disk cache between runs instead.
# Headers (COOP/COEP for the WebContainers editor), the SPA fallback and caching are
# configured in Caddy on the server. Pull requests that touch this file only build.
#
# The `production` environment holds DEPLOY_SSH_KEY (secret) and DEPLOY_KNOWN_HOSTS
# (variable) and is limited to `main`. On the server (Caddy) that key may only run
# `rrsync -wo -munge` into the site directory.

name: Deploy angular-docs.ru

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_HOST: 31.129.57.175
  DEPLOY_USER: angular-docs-deploy
  SITE_DOMAIN: angular-docs.ru

jobs:
  build:
    if: github.repository == 'misha98857/angular-docs.ru'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space, add swap
        # The regular runner has 16 GB RAM; the cold build peaks above that.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          df -h /
          free -h

      - uses: actions/checkout@v7
        with:
          # Version stamping (--config=snapshot-build) reads git history; blobs are fetched lazily.
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-ci
          key: bazel-adev-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            bazel-adev-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'pnpm-lock.yaml') }}-
            bazel-adev-${{ runner.os }}-

      - name: Configure Bazel for CI
        run: |
          cat >> .bazelrc.user <<EOF
          startup --host_jvm_args=-Xmx4g
          build --jobs=3
          build --announce_rc
          build --verbose_failures
          build --disk_cache=$HOME/.cache/bazel-ci/disk
          build --repository_cache=$HOME/.cache/bazel-ci/repo
          common --color=yes
          EOF

      - name: Build adev
        # `snapshot-build` stamps the exact version with sha in the footer.
        run: |
          (while sleep 60; do free -m | awk 'NR==2{printf "[mem] used %sM, available %sM", $3, $7} NR==3{printf ", swap used %sM\n", $3}'; done) &
          pnpm bazel build //adev:build.production --config=snapshot-build

      - name: Show OOM kills
        if: failure() || cancelled()
        run: sudo dmesg | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true

      # Saved right after the build (even a failed one), so later steps can't cost a cold rebuild.
      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outputs.cache-matched-key != steps.bazel-cache.outputs.cache-primary-key
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-ci
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Pack site
        # -h: Bazel output is full of symlinks, pack the files they point to.
        run: |
          out=dist/bin/adev/dist/browser
          test -f "$out/index.html"
          test -f "$out/index.csr.html"
          tar -C "$out" -czhf site.tar.gz .
          echo "$(tar -tzf site.tar.gz | grep -c '\.html$') html files, $(du -h site.tar.gz | cut -f1) packed"

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site.tar.gz
          compression-level: 0
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://angular-docs.ru/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site

      - name: Unpack
        run: |
          mkdir site
          tar -xzf site.tar.gz -C site
          test -f site/index.html

      - name: Upload to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        # --checksum: Bazel rewrites mtimes on every build; only changed files go over the
        # wire and unchanged ones keep their Last-Modified. --delay-updates swaps files in
        # at the end, --delete-after removes old chunks only after the new ones are in place.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rcz --delete-after --delay-updates --chmod=D755,F644 --stats \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            site/ "$DEPLOY_USER@$DEPLOY_HOST:"
          rm -f ~/.ssh/deploy_key

      - name: Smoke check
        # Resolves the domain to the server directly, so it works before DNS and TLS are switched.
        run: |
          resolve="--resolve $SITE_DOMAIN:80:$DEPLOY_HOST --resolve $SITE_DOMAIN:443:$DEPLOY_HOST"
          curl -fsSL $resolve "http://$SITE_DOMAIN/guide/signals" | grep -q '<title>'
          headers=$(curl -fsSIL $resolve "http://$SITE_DOMAIN/")
          # Same values as adev/firebase.json.
          grep -qi '^cross-origin-opener-policy: same-origin' <<<"$headers"
          grep -qi '^cross-origin-embedder-policy: credentialless' <<<"$headers"
          echo "OK: page and COOP/COEP headers served by $DEPLOY_HOST"
